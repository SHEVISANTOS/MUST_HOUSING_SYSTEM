{% extends 'base.html' %}
{% block title %}My Profile{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">📋 Account Information</div>
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <table style="width: 100%;">
                <tr style="border-bottom: 1px solid #eee;">
                    <td style="padding: 15px 0; width: 30%; color: var(--text-grey);">Username:</td>
                    <td style="padding: 15px 0; font-weight: 600;">{{ user.username }}</td>
                </tr>
                <tr style="border-bottom: 1px solid #eee;">
                    <td style="padding: 15px 0; color: var(--text-grey);">Email:</td>
                    <td style="padding: 15px 0;"><input type="email" name="email" value="{{ user.email }}" class="form-control"></td>
                </tr>
                <tr style="border-bottom: 1px solid #eee;">
                    <td style="padding: 15px 0; color: var(--text-grey);">Role:</td>
                    <td style="padding: 15px 0; font-weight: 600;">{{ user.role }}</td>
                </tr>
                <tr style="border-bottom: 1px solid #eee;">
                    <td style="padding: 15px 0; color: var(--text-grey);">Phone:</td>
                    <td style="padding: 15px 0;"><input type="text" name="phone" value="{{ user.phone }}" class="form-control"></td>
                </tr>
            </table>
            <button type="submit" class="btn-green" style="margin-top: 20px;">Save Changes</button>
        </form>
    </div>
</div>
{% endblock %}

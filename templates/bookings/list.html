{% extends 'base.html' %}
{% block content %}
<h4>My Bookings</h4>
<table class="table">
    <thead><tr><th>Property</th><th>Dates</th><th>Status</th><th>Deposit</th></tr></thead>
    <tbody>
    {% for b in bookings %}
        <tr>
            <td>{{ b.property.title }}</td>
            <td>{{ b.move_in_date }} to {{ b.move_out_date }}</td>
            <td><span class="badge bg-{{ b.status|yesno:'warning,success,danger,secondary' }}">{{ b.status }}</span></td>
            <td>TZS {{ b.deposit_paid }}</td>
        </tr>
    {% empty %}
        <tr><td colspan="4">No bookings yet.</td></tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}

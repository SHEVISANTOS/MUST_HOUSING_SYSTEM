# Nginx server block for the Ubuntu/Gunicorn deployment.
# Install as /etc/nginx/sites-available/vot-house-finding, then:
#   sudo ln -s /etc/nginx/sites-available/vot-house-finding /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# No domain yet - this listens on port 80 for any Host (server_name _),
# i.e. reachable by the server's bare IP. Once a domain is pointed at this
# server, replace "server_name _;" with the real domain and run certbot
# (see DEPLOY_NOTES.md) to add HTTPS.

upstream vot_house_finding {
    server unix:/run/vot-house-finding/gunicorn.sock;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 25M;  # property listings allow up to 10 images x 2MB each

    location /static/ {
        alias /opt/vot-house-finding/staticfiles/;
    }

    location /media/ {
        # Only used when R2 env vars aren't set (local-disk media fallback -
        # see config/settings.py's STORAGES). If R2 is configured, media is
        # served straight from R2's public URL and this block is unused.
        alias /opt/vot-house-finding/media/;
    }

    location / {
        proxy_pass http://vot_house_finding;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Nginx server block for the Ubuntu/Gunicorn deployment.
# Install as /etc/nginx/sites-available/vot-house-finding, then:
#   sudo ln -s /etc/nginx/sites-available/vot-house-finding /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Listens on port 8080, not 80/443 - this server already runs a separate
# app (VOT Stays) whose own nginx site owns 80/443 on the default server
# name. Reach this app at http://<server-ip>:8080/ for now. Once you have a
# domain/subdomain for this app specifically, switch this to "listen 80;"
# with "server_name your-domain;" and run certbot for HTTPS (see
# DEPLOY_NOTES.md) - just make sure it's a distinct server_name from
# whatever VOT Stays' site answers to, so nginx can route between them.

upstream vot_house_finding {
    server unix:/run/vot-house-finding/gunicorn.sock;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    client_max_body_size 25M;  # property listings allow up to 10 images x 2MB each

    location /static/ {
        alias /srv/must_housing/staticfiles/;
    }

    location /media/ {
        # Only used when R2 env vars aren't set (local-disk media fallback -
        # see config/settings.py's STORAGES). If R2 is configured, media is
        # served straight from R2's public URL and this block is unused.
        alias /srv/must_housing/media/;
    }

    location / {
        proxy_pass http://vot_house_finding;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
